<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Turn any wallpaper into a lockscreen contact card. If your phone is lost, the finder knows who to call." />
    <meta name="theme-color" content="#060606" />
    <title>LockCard — Lockscreen Contact Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .phone-mockup {
        width: 280px;
        height: 580px;
        background: #1a1a1a;
        border-radius: 36px;
        padding: 12px;
        box-shadow:
          0 0 0 2px #333,
          0 20px 60px rgba(0, 0, 0, 0.5),
          inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        position: relative;
      }

      .phone-mockup::before {
        content: "";
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 6px;
        background: #333;
        border-radius: 3px;
        z-index: 10;
      }

      .phone-screen {
        width: 100%;
        height: 100%;
        border-radius: 24px;
        overflow: hidden;
        background: #000;
      }

      @media (max-width: 400px) {
        .phone-mockup {
          width: 240px;
          height: 500px;
          border-radius: 30px;
          padding: 10px;
        }
        .phone-screen {
          border-radius: 20px;
        }
      }

      /* Landing page animations */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes slideInLeft {
        from {
          opacity: 0;
          transform: translateX(-30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes pulseGlow {
        0%, 100% {
          box-shadow:
            0 0 0 2px #333,
            0 20px 60px rgba(0, 0, 0, 0.5),
            inset 0 0 0 1px rgba(255, 255, 255, 0.05),
            0 0 20px rgba(245, 158, 11, 0.1);
        }
        50% {
          box-shadow:
            0 0 0 2px #333,
            0 20px 60px rgba(0, 0, 0, 0.5),
            inset 0 0 0 1px rgba(255, 255, 255, 0.05),
            0 0 40px rgba(245, 158, 11, 0.2);
        }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      .anim-fade-up {
        animation: fadeUp 700ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }

      .anim-fade-in {
        animation: fadeIn 600ms ease-out both;
      }

      .anim-scale-in {
        animation: scaleIn 600ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }

      .anim-slide-left {
        animation: slideInLeft 600ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }

      .delay-1 { animation-delay: 80ms; }
      .delay-2 { animation-delay: 160ms; }
      .delay-3 { animation-delay: 240ms; }
      .delay-4 { animation-delay: 320ms; }
      .delay-5 { animation-delay: 400ms; }
      .delay-6 { animation-delay: 480ms; }
      .delay-7 { animation-delay: 560ms; }
      .delay-8 { animation-delay: 640ms; }

      .float-anim {
        animation: float 4s ease-in-out infinite;
      }

      .glow-pulse {
        animation: pulseGlow 3s ease-in-out infinite;
      }

      .shimmer-text {
        background: linear-gradient(
          90deg,
          #f5f5f5 0%,
          #fbbf24 30%,
          #f5f5f5 60%,
          #fbbf24 90%,
          #f5f5f5 100%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 6s ease-in-out infinite;
      }

      .hover-lift {
        transition: transform 200ms cubic-bezier(0.23, 1, 0.32, 1), box-shadow 200ms ease;
      }

      .hover-lift:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      }

      .hover-lift:active {
        transform: scale(0.98) translateY(-2px);
      }

      .glass {
        background: rgba(20, 20, 20, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .gradient-border {
        position: relative;
      }

      .gradient-border::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, rgba(245,158,11,0.3), rgba(245,158,11,0.05), rgba(245,158,11,0.2));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .anim-fade-up,
        .anim-fade-in,
        .anim-scale-in,
        .anim-slide-left,
        .float-anim,
        .shimmer-text {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
